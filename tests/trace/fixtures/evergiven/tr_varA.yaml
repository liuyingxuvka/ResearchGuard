    ~7,000; early Apr 2021 ~8,000; Jun 2021 ~10,500; Sep 2021 ~14,000 (peak).'
  normalized_summary: Rate quadrupled Oct 2020 - Jan 2021, dipped before 23 Mar, rose
    after, and kept rising to a Sep 2021 peak.
