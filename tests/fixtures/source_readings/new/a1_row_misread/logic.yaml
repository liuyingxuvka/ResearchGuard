model:
  id: heatpump
  title: Did the heat pump fitted at 14 Alder Close in March 2023 cut the house's
    gas use in January 2024 compared with January 2023, or was January 2024 simply
    milder?
  root_claim: h_hp
nodes:
  h_hp:
    type: Claim
    text: The heat pump fitted in March 2023 cut the house's gas use in January 2024.
  h_mild:
    type: Claim
    text: January 2024 was milder, so the house needed less gas.
  anc-commission:
    type: Evidence
    text: Heat pump commissioned and gas boiler capped on 14 March 2023.
    provenance:
    - origin_kind: external_source
      quote: The air-source heat pump was commissioned on 14 March 2023 and the gas
        boiler was capped the same day.
      source_id: src-install
      locator: anc-commission
      content_hash: sha256:8b439e4647adfcdbe10cb23d5da01676df17b04ff89e0fe7e3ed83660e3f008b
      source_reference: null
      source_date: '2023-03-14'
      metadata:
        locator_text: commissioning record, paragraph 1
  anc-gas:
    type: Evidence
    text: Gas fell from 216 cubic metres (Jan 2023) to 17 cubic metres (Jan 2024).
    provenance:
    - origin_kind: external_source
      quote: 'Gas (cubic metres): Jan 2023 216; Jan 2024 17.'
      source_id: src-meter
      locator: anc-gas
      content_hash: sha256:09a0d63a0ac6708a93a07897c6a7e46bcb4550615335c03174e7bc3a67791b81
      source_reference: null
      source_date: null
      metadata:
        locator_text: monthly totals table, rows Jan 2023 and Jan 2024
  anc-temp:
    type: Evidence
    text: 'Mean temperature 3.1 degrees Celsius (Jan 2023) against 4.4 degrees Celsius
      (Jan 2024): January 2024 was milder.'
    provenance:
    - origin_kind: external_source
      quote: 'Mean outdoor temperature (degrees Celsius): Jan 2023 3.1; Jan 2024 4.4.'
      source_id: src-meter
      locator: anc-temp
      content_hash: sha256:456b514d86d9df8bcfeeb58c94302f8a816338dab97774472fef04988b6753b9
      source_reference: null
      source_date: null
      metadata:
        locator_text: monthly totals table, temperature column
  R_h_mild_anc-temp:
    type: Rebuttal
    text: 'Opposing evidence for h_mild: Mean outdoor temperature (degrees Celsius):
      Jan 2023 3.1; Jan 2024 4.4.'
  W_cooker:
    type: Warrant
    text: With the boiler capped, only the cooker still burns gas.
    confidence: 0.7
  A_scale:
    type: Assumption
    text: Gas use fell by about 92% from Jan 2023 to Jan 2024, far more than weather
      explains.
    confidence: 0.6
