  source_policy: public_only
  domain_hints: [Ever Given, Suez Canal, Drewry WCI, Shanghai-Rotterdam, Yantian]
leads:
- lead_id: lead-cause
  question: Did the Ever Given grounding cause the 2021 Asia-Europe freight rate rise?
  hypothesis: The blockage removed capacity and caused the rise.
  importance: 0.9
