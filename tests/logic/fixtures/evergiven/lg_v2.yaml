model:
  id: evergiven_freight
  title: Did the Ever Given grounding cause the 2021 Asia-Europe freight rate rise?
  root_claim: C0
nodes:
  C0:
    type: Claim
    text: The Ever Given grounding (23-29 Mar 2021) caused the 2021 rise in Asia-Europe
      container spot rates.
    scope: Asia-Europe spot rates, 2021
    importance: 0.9
  C_alt:
    type: Claim
    text: Pandemic demand and container shortage caused the 2021 rise; the blockage
      added a short bump.
    scope: Asia-Europe spot rates, 2021
    importance: 0.9
  E_dates:
    type: Evidence
    text: Grounding 23 Mar 2021, refloated 29 Mar 2021 (SCA).
    confidence: 0.9
    scope: Asia-Europe spot rates, 2021
    provenance:
    - origin_kind: external_source
      source_reference: https://www.suezcanal.gov.eg/
      locator: SCA statement 29 Mar 2021, para 1
      source_date: '2021-03-29'
      content_hash: sha256:89dd5d7c0de38be2163cd01978e9bbb1da173d8b148b72e9b01b6bc79f83247d
  E_series:
    type: Evidence
    text: 'WCI Shanghai-Rotterdam: ~2,000 (Oct 2020), ~8,000 (Jan 2021), ~7,000 (mid
      Mar), ~10,500 (Jun), ~14,000 (Sep 2021).'
    confidence: 0.7
    scope: Asia-Europe spot rates, 2021
    provenance:
    - origin_kind: external_source
      source_reference: https://www.drewry.co.uk/
      locator: WCI Shanghai-Rotterdam weekly table
      content_hash: sha256:56060a17de523ea6b5681fe7a9db21625e39b2963ba7a55c091107dacf2e2766
  E_pretrend:
    type: Evidence
    text: 'UNCTAD RMT 2021: rates surged from H2 2020 on demand rebound and container
      scarcity.'
    confidence: 0.8
    scope: Asia-Europe spot rates, 2021
    provenance:
    - origin_kind: external_source
      source_reference: https://unctad.org/webflyer/review-maritime-transport-2021
      locator: ch. 3
      content_hash: sha256:7f3349aa81489945240664a3ad7f5b755e418dffe9edcbf11e402cba877b8365
  W_capacity:
    type: Warrant
    text: Removing transit capacity for ~1-2 weeks raises spot rates on the affected
      lane.
    confidence: 0.6
  A_timing:
    type: Assumption
    text: The Q2-Q3 rise is attributable to the March blockage rather than continuing
      pre-existing pressure.
    confidence: 0.4
  R_pretrend:
    type: Rebuttal
    text: Rates had already quadrupled before the blockage; the rise continued long
      after the queue cleared.
    confidence: 0.8
  E_transpacific:
    type: Evidence
    text: 'WCI Shanghai-Los Angeles (no Suez exposure): ~4,000 (Jan 2021) -> ~12,000
      (Sep 2021).'
    confidence: 0.7
    scope: Asia-Europe spot rates, 2021
    provenance:
    - origin_kind: external_source
      source_reference: https://www.drewry.co.uk/
      locator: WCI Shanghai-LA weekly table
      content_hash: sha256:3a7f3cbf882d600e0405f825f4ffb5544d3dbf677be22b699fd6f24e6a0a3c07
