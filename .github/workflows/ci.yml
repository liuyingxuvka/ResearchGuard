name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[test,viewer]"
      - name: Complete native suite
        if: runner.os == 'Linux'
        run: python -m pytest
      - name: FlowGuard map check and release
        if: runner.os == 'Linux'
        run: |
          python -m flowguard map check
          python -m flowguard release
      - name: Focused Windows boundaries
        if: runner.os == 'Windows'
        run: >-
          python -m pytest
          tests/test_install_skill.py
          tests/test_root_cli.py
          tests/logic/test_cli.py
          tests/source/test_cli.py
          tests/trace/test_inference_kernel.py
          tests/experiment/test_recommendation.py
      - name: Build release distributions
        if: runner.os == 'Linux'
        run: python -m build
