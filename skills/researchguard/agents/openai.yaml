  short_description: "Route research work to the smallest sufficient Guard set"
  default_prompt: "Use $researchguard only when research ownership is ambiguous or irreducibly cross-member: extract source-bound primary responsibilities plus context, read the compact admission index, let current contracts derive the unique minimum sufficient member set, reject over-selection, and require explicit order, dependencies, responsibilities, handoffs, field owners, and claim boundary for any necessary composition. Load only selected members; a composition plan is not native execution evidence."
